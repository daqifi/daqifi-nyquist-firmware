name: scpi-wiki-sync

# CLAUDE.md has always said the wiki SCPI reference must be updated whenever a
# command is added, renamed, or removed. It was written down and not enforced,
# and the two drifted in BOTH directions: 37 shipped commands had no wiki entry
# (including the whole DIO:EVENt and DIO:COUNter families), and 11 documented
# commands were not registered at all -- two of them the OLD NAMES of a renamed
# pair, so following the reference produced -113 Undefined header.
#
# On PR/push this runs only when the SCPI sources or the checker change, so an
# ordinary firmware PR never pays for it. A weekly run covers drift introduced
# from the wiki side, which cannot trigger a workflow here.

on:
  pull_request:
    branches: [main]
    paths:
      - 'firmware/src/services/SCPI/**'
      - 'tools/lint/scpi_wiki_sync.py'
      - 'tools/lint/scpi-wiki-allow.txt'
      - '.github/workflows/scpi-wiki-sync.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/src/services/SCPI/**'
      - 'tools/lint/scpi_wiki_sync.py'
      - 'tools/lint/scpi-wiki-allow.txt'
      - '.github/workflows/scpi-wiki-sync.yml'

  # Drift can also be introduced from the WIKI side, and a wiki push cannot
  # trigger a workflow in this repository. Without a timed run, deleting a row
  # over there would go unnoticed until the next SCPI change over here.
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC

permissions:
  contents: read   # checkout + clone a public wiki; nothing is written

jobs:
  sync:
    name: SCPI reference in sync with the wiki
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The wiki is a separate repository, so it cannot be updated in the same
      # PR as the firmware change. That is deliberate: this gate failing is the
      # reminder to push the wiki edit, which is exactly the step that has been
      # skipped for years.
      - name: Clone the wiki
        run: |
          if ! git clone --depth 1 \
              https://github.com/daqifi/daqifi-nyquist-firmware.wiki.git /tmp/daqifi-wiki; then
            echo "::error::could not clone the wiki repository"
            echo "The SCPI reference lives at"
            echo "  https://github.com/daqifi/daqifi-nyquist-firmware.wiki.git"
            echo "If that URL moved, update this workflow and tools/lint/scpi_wiki_sync.py."
            exit 1
          fi

      - name: Compare the command table against the wiki
        run: python3 tools/lint/scpi_wiki_sync.py --wiki /tmp/daqifi-wiki
