name: cppcheck

on:
  pull_request:
    branches: [main]
    paths:
      - 'firmware/src/**'
      - 'tools/lint/**'
      - '.github/workflows/cppcheck.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/src/**'
      - 'tools/lint/**'
      - '.github/workflows/cppcheck.yml'

permissions:
  contents: read   # only checking out + running a local tool, no writes

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-24.04   # ships cppcheck 2.13.0 — matches the baseline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        env:
          # Pin the version we developed/baselined against. Future Ubuntu
          # apt updates that bump cppcheck can change output for the same
          # source — without this gate, that would silently fail every PR
          # until someone regenerates the baseline.
          EXPECTED_CPPCHECK_VERSION: "Cppcheck 2.13.0"
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          ACTUAL=$(cppcheck --version)
          echo "$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CPPCHECK_VERSION" ]; then
            echo "::error::cppcheck version drift — got '$ACTUAL', expected '$EXPECTED_CPPCHECK_VERSION'"
            echo "Either bump EXPECTED_CPPCHECK_VERSION in this workflow + regenerate the baseline,"
            echo "or pin runs-on to an Ubuntu image that still ships the expected version."
            exit 1
          fi

      # #787: log text reaches operators over SYST:LOG?, where non-ASCII is
      # mangled on a cp1252 console, can throw outright in a Python client,
      # and eats the firmware's 128-byte LOG_MESSAGE_SIZE (so it truncates
      # the rest of the message too). CLAUDE.md documented the rule long
      # before this gate existed and 35 sites accumulated anyway, which is
      # why it is enforced rather than only written down.
      # Runs before cppcheck: it needs no toolchain and fails in under a
      # second, so a violation reports immediately instead of after the
      # slower analysis.
      - name: Check log literals are ASCII
        run: python3 tools/lint/check_log_ascii.py

      - name: Run cppcheck
        run: bash tools/lint/cppcheck.sh /tmp/cppcheck-current.txt

      - name: Comparator self-test
        run: python3 -I tools/lint/cppcheck_compare.py --self-test

      # Line-insensitive multiset comparison (#1309): a plain `diff` failed on
      # any edit that shifted a line number above an accepted finding. See the
      # docstring in tools/lint/cppcheck_compare.py for the normalisation and
      # its one known residual (swap of same-message findings within a file).
      - name: Compare against committed baseline
        run: |
          if python3 -I tools/lint/cppcheck_compare.py tools/lint/cppcheck-baseline.txt /tmp/cppcheck-current.txt; then
            exit 0
          fi

          echo ""
          echo "::error::cppcheck findings differ from committed baseline"
          echo ""
          echo "NEW findings:"
          echo "  - Real bug -> fix it"
          echo "  - False positive -> add to tools/lint/cppcheck-suppress.txt"
          echo ""
          echo "RESOLVED findings:"
          echo "  - Regenerate the baseline:"
          echo "      bash tools/lint/cppcheck.sh"
          echo "    and commit the updated tools/lint/cppcheck-baseline.txt"
          echo ""
          exit 1
