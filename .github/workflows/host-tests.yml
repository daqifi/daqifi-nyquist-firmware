name: host-tests

# tests/host/ (issue #124) is a PC-based (gcc) unit-test suite for
# self-contained firmware utility modules -- no hardware, no MPLAB X, no
# RTOS. The suite's own README has claimed since its creation that
# `make run`'s non-zero exit code "drops straight into CI", but until this
# workflow no CI job anywhere in this repo ever built or ran it -- for any
# of its three tests, not just the one added by #946. So the claim was
# false, and cppcheck/scpi-claim-path/scpi-wiki-sync/release-hex were the
# only real gates. This workflow makes the README's claim true.
#
# Triggers cover every firmware source each host test either compiles
# directly or greps for drift (see tests/host/Makefile and README.md):
#   - test_circularbuffer.c: firmware/src/Util/CircularBuffer.c/.h
#   - test_fixedpointfmt.c:  firmware/src/Util/FixedPointFmt.h
#   - test_943_bench_stall_bound.c: greps SCPIStorageSD.c for the two timeout
#     constants and fails the build (not just the test) if either drifts --
#     scoped to the whole SCPI/ directory rather than just that one file so a
#     future move of the constants still trips this.
#   - test_ad7609_scale.c (#889): compiles firmware/src/HAL/ADC/AD7609Scale.h
#     directly. Scoped to the whole HAL/ADC/ directory for the same reason as
#     SCPI/ above -- the arithmetic was split OUT of AD7609.h to make it
#     host-testable, so a future move back, or into a sibling file, must still
#     trip this trigger. Without the entry this test was unreachable by CI: a
#     PR editing only AD7609Scale.h matched no path here, and no other
#     workflow can catch a semantically-valid reordering (cppcheck fires on
#     firmware/src/** but diffs a byte-exact baseline, so
#     `scaled * calM + calB` -> `(scaled + calB) * calM` is invisible to it).
#     Found by the #941 pre-merge adversarial audit, which is also the PR that
#     added the test -- it wired up the suite and not its trigger.
#
# THE ADC ENTRY IS A DIRECTORY, AND THAT IS BROADER THAN THE INVARIANT ABOVE.
# firmware/src/HAL/ADC/ holds nine files; exactly one (AD7609Scale.h) is read
# by a host test. The glob matches the other eight too -- MC12bADC.c, AD7173.*,
# AdcThreshold.*, AD7609.c/.h -- so an edit to any of them queues this job,
# which then builds and passes having exercised nothing related. That costs a
# CI run and establishes nothing; it does not weaken any gate.
#
# It is deliberate, and a narrower list is the worse trade. The whole point of
# #889's split was to move the arithmetic OUT of AD7609.h into a file a host
# test can compile -- so the arithmetic has already moved once, and a
# file-scoped trigger is escaped by moving it again, into a sibling in this
# same directory. A trigger that a refactor can silently step out of is the
# defect this entry was added to fix (a PR editing only AD7609Scale.h used to
# match no path at all), so it is scoped where a refactor cannot escape it.
#
# So read the invariant at the granularity that is actually true: every path
# listed here CONTAINS at least one source a host test reads. Per-FILE it holds
# for the Util entries and not for this directory, and an earlier revision of
# this comment claimed the opposite -- it said MC12bADC.c was "NOT listed",
# which the glob added in the same commit plainly matches. Caught by #941's
# round-2 pre-merge audit.
#
#   - test_958_sd_benchmark_filename_collision.c: greps SCPIStorageSD.c for the
#     scratch-name format (covered by the SCPI/ entry above) AND
#     sd_card_services/sd_card_manager.h for SD_CARD_MANAGER_CONF_FILE_NAME_LEN_MAX
#     being 40, which its no-truncation case is arithmetic on. That header had
#     no entry here, so a PR changing ONLY the length constant matched no path
#     and the guard did not run -- a guard that cannot fire for the file it
#     guards. Listed by file, not by directory: sd_card_manager.c is large and
#     changes often, and no host test reads it.
#   - test_1004_help_write_abort.c: greps config/default/FreeRTOSConfig.h for
#     configTICK_RATE_HZ being 1000 and configTICK_TYPE_WIDTH_IN_BITS being
#     32-bit. Same gap, pre-existing on main: the pins were added with the test
#     and the trigger was not. test_958's uniqueness argument now rests on that
#     same 32-bit width -- a 16-bit tick makes its sequence field the only
#     discriminator -- so the entry is load-bearing for two suites, not one.
#   - test_json_string_escape.c (#164): compiles
#     firmware/src/services/JSON_StringEscape.h directly. Scoped to that one
#     file PLUS firmware/src/services/JSON_Encoder.c (its sole consumer, and
#     the file the escaping logic was split OUT of), not the whole
#     services/ directory -- unlike AD7609Scale.h, which came out of a
#     multi-file HAL/ADC/ family, this header has exactly one file it could
#     be folded back into, so listing that file by name closes the same
#     "refactor escapes the trigger" gap without dragging in every unrelated
#     services/ file (streaming.c, wifi_manager.c, sd_card_manager.c, the
#     whole SCPI/ subdirectory, ...).

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/host/**'
      - 'firmware/src/Util/CircularBuffer.c'
      - 'firmware/src/Util/CircularBuffer.h'
      - 'firmware/src/Util/FixedPointFmt.h'
      - 'firmware/src/services/SCPI/**'
      - 'firmware/src/HAL/ADC/**'
      - 'firmware/src/services/JSON_StringEscape.h'
      - 'firmware/src/services/JSON_Encoder.c'
      - 'firmware/src/services/sd_card_services/sd_card_manager.h'
      - 'firmware/src/config/default/FreeRTOSConfig.h'
      - '.github/workflows/host-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tests/host/**'
      - 'firmware/src/Util/CircularBuffer.c'
      - 'firmware/src/Util/CircularBuffer.h'
      - 'firmware/src/Util/FixedPointFmt.h'
      - 'firmware/src/services/SCPI/**'
      - 'firmware/src/HAL/ADC/**'
      - 'firmware/src/services/JSON_StringEscape.h'
      - 'firmware/src/services/JSON_Encoder.c'
      - 'firmware/src/services/sd_card_services/sd_card_manager.h'
      - 'firmware/src/config/default/FreeRTOSConfig.h'
      - '.github/workflows/host-tests.yml'

permissions:
  contents: read   # checkout + gcc build + run only, no writes

jobs:
  host-tests:
    name: tests/host (gcc, no hardware)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make run
        working-directory: tests/host
        run: make run
