name: host-tests

# tests/host/ (issue #124) is a PC-based (gcc) unit-test suite for
# self-contained firmware utility modules -- no hardware, no MPLAB X, no
# RTOS. The suite's own README has claimed since its creation that
# `make run`'s non-zero exit code "drops straight into CI", but until this
# workflow no CI job anywhere in this repo ever built or ran it -- for any
# of its three tests, not just the one added by #946. So the claim was
# false, and cppcheck/scpi-claim-path/scpi-wiki-sync/release-hex were the
# only real gates. This workflow makes the README's claim true.
#
# Triggers cover every firmware source each host test either compiles
# directly or greps for drift (see tests/host/Makefile and README.md):
#   - test_circularbuffer.c: firmware/src/Util/CircularBuffer.c/.h
#   - test_fixedpointfmt.c:  firmware/src/Util/FixedPointFmt.h
#   - test_943_bench_stall_bound.c: greps SCPIStorageSD.c for the two timeout
#     constants and fails the build (not just the test) if either drifts --
#     scoped to the whole SCPI/ directory rather than just that one file so a
#     future move of the constants still trips this.
#   - test_ad7609_scale.c (#889): compiles firmware/src/HAL/ADC/AD7609Scale.h
#     directly. Scoped to the whole HAL/ADC/ directory for the same reason as
#     SCPI/ above -- the arithmetic was split OUT of AD7609.h to make it
#     host-testable, so a future move back, or into a sibling file, must still
#     trip this trigger. Without the entry this test was unreachable by CI: a
#     PR editing only AD7609Scale.h matched no path here, and no other
#     workflow can catch a semantically-valid reordering (cppcheck fires on
#     firmware/src/** but diffs a byte-exact baseline, so
#     `scaled * calM + calB` -> `(scaled + calB) * calM` is invisible to it).
#     Found by the #941 pre-merge adversarial audit, which is also the PR that
#     added the test -- it wired up the suite and not its trigger.
#
# THE ADC ENTRY IS A DIRECTORY, AND THAT IS BROADER THAN THE INVARIANT ABOVE.
# firmware/src/HAL/ADC/ holds nine files; exactly one (AD7609Scale.h) is read
# by a host test. The glob matches the other eight too -- MC12bADC.c, AD7173.*,
# AdcThreshold.*, AD7609.c/.h -- so an edit to any of them queues this job,
# which then builds and passes having exercised nothing related. That costs a
# CI run and establishes nothing; it does not weaken any gate.
#
# It is deliberate, and a narrower list is the worse trade. The whole point of
# #889's split was to move the arithmetic OUT of AD7609.h into a file a host
# test can compile -- so the arithmetic has already moved once, and a
# file-scoped trigger is escaped by moving it again, into a sibling in this
# same directory. A trigger that a refactor can silently step out of is the
# defect this entry was added to fix (a PR editing only AD7609Scale.h used to
# match no path at all), so it is scoped where a refactor cannot escape it.
#
# So read the invariant at the granularity that is actually true: every path
# listed here CONTAINS at least one source a host test reads. Per-FILE it holds
# for the Util entries and not for this directory, and an earlier revision of
# this comment claimed the opposite -- it said MC12bADC.c was "NOT listed",
# which the glob added in the same commit plainly matches. Caught by #941's
# round-2 pre-merge audit.
#
#   - test_1056_wait_loop.c (#1056, was test_913_spi_wait_stat.c): compiles
#     firmware/src/HAL/WaitLoop.h directly -- the ONE spin-then-yield wait loop
#     UserSpi.c, UserUart.c and UserI2c.c now share. That header gets its own
#     line below: it sits directly in firmware/src/HAL/, which no glob here
#     matches (HAL/ADC/** and HAL/DAC7718/** are subdirectories), so without
#     it a PR editing only the loop under test would queue no job at all --
#     exactly the gap #941's audit found for AD7609Scale.h.
#
#     The three drivers stay listed as well. They are no longer grepped (#1056
#     deleted those guards along with the copied constants they pinned), but
#     they are the header's only consumers, so an edit to one is the change
#     most likely to need this suite re-run. Only UserSpi.c was listed at
#     first, so a PR touching only the uart or i2c twin matched no path and
#     the suite did not run for the file it covered. A shape checker,
#     tools/lint/wait_loop_shape.py, was listed here too and has been deleted;
#     the block above $(WAITLOOP_BIN) in tests/host/Makefile records why, and
#     why #1056 replaced it with a header the test can compile instead.
#   - test_json_string_escape.c (#164): compiles
#     firmware/src/services/JSON_StringEscape.h directly. Scoped to that one
#     file PLUS firmware/src/services/JSON_Encoder.c (its sole consumer, and
#     the file the escaping logic was split OUT of), not the whole
#     services/ directory -- unlike AD7609Scale.h, which came out of a
#     multi-file HAL/ADC/ family, this header has exactly one file it could
#     be folded back into, so listing that file by name closes the same
#     "refactor escapes the trigger" gap without dragging in every unrelated
#     services/ file (streaming.c, wifi_manager.c, sd_card_manager.c, the
#     whole SCPI/ subdirectory, ...).
#   - test_947_sysinfo_write_abort.c: greps SCPIInterface.c for three
#     constants (the two shared SCPI_WriteWithRetry retry constants plus the
#     new per-callback SCPI_SYSINFO_WRITE_BUDGET_MS) and fails the build if
#     any drifts. Already covered by the existing 'firmware/src/services/SCPI/**'
#     entry above. It ALSO greps firmware/src/config/default/FreeRTOSConfig.h
#     for the 1000 Hz tick rate and 32-bit TickType_t width its millisecond
#     arithmetic assumes (the same assumption test_943_bench_stall_bound.c
#     already makes, undocumented in this file's trigger list until now) --
#     that file is NOT matched by any entry above, so it gets its own line.
#     Found by Qodo /agentic_review on the #947 PR: without this entry, a
#     tick-config change could silently invalidate both host tests' timing
#     model and CI would stay green.
#   - test_980_dac7718_error_paths.c (#980): the Makefile target lists
#     firmware/src/HAL/DAC7718/DAC7718.c as a build dependency (its grep
#     guards pin identifiers/branch-counts in that file, and SCPIDAC.c) --
#     but until this entry, only firmware/src/services/SCPI/** (SCPIDAC.c)
#     was covered here, not the DAC7718/ directory itself. A PR touching
#     ONLY DAC7718.c (no SCPIDAC.c change) matched no path and would not
#     have run this suite, silently skipping the error-path checks on
#     exactly the file whose control-flow shape they exist to mirror.
#     Found by Qodo's #990 pre-merge review.
#   - test_1000_sd_log_arm_budget.c (#1000): measures the #942 SD-log-arm
#     refusal's LOG_E line against the ceiling Logger actually cuts at. Its
#     fixture is GENERATED at build time from SCPIInterface.c and
#     SCPIStorageSD.c -- both already covered by the SCPI/ entry -- AND from
#     firmware/src/Util/Logger.h and firmware/src/Util/Logger.c, which is why
#     both are listed below. The ceiling is split across those two files:
#     LOG_MESSAGE_SIZE is the constant in the header, but what survives is set
#     by the two reservations in the .c -- vsnprintf(buffer,
#     LOG_MESSAGE_SIZE - 2, ...) and the min((LOG_MESSAGE_SIZE - 3), size)
#     clamp. A PR that lowered either and touched nothing else would change
#     what "fits" means while queueing no job that re-measures it, leaving the
#     extraction to run for the first time on some later, unrelated PR.
#
#     Listed by name rather than as Util/, matching the CircularBuffer and
#     FixedPointFmt entries above: this directory holds many files no host
#     test reads, so a glob would queue the job on most edits to it for
#     nothing. The "refactor escapes the trigger" worry that made HAL/ADC/ a
#     directory does not bite the same way here -- the extraction fails the
#     BUILD, loudly and by name, if either constant stops parsing where it
#     looks for it, so a move cannot pass silently.
#
#     NOTE: PR #1017 (#1001) adds these same two entries for the same reason,
#     in its own hunk further down each list. Whichever merges second should
#     keep ONE copy of each path -- a duplicate is harmless to Actions but is
#     noise, and the two comments explaining it are then redundant too.
#   - test_1004_help_write_abort.c (#1004): the Makefile target's recipe greps
#     firmware/src/config/default/FreeRTOSConfig.h for configTICK_RATE_HZ and
#     configTICK_TYPE_WIDTH_IN_BITS -- the test derives its milliseconds<->tick
#     assumptions from both -- but until this entry that file was not in
#     either path list. A change touching only FreeRTOSConfig.h, exactly the
#     change that would invalidate those assumptions, never re-ran the suite.
#     Found by PR #976's adversarial audit (#1062) and filed rather than
#     folded into that PR, which only added tools/lint/cdef.py to this
#     workflow and picked this gap up from a merge with main.
#   - test_999_scpi_context_storage_isolation.c: proves USB and TCP SCPI
#     contexts do not share storage. Its Makefile target ($(SCPI999_BIN))
#     lists firmware/src/services/UsbCdc/UsbCdc.c and
#     firmware/src/services/wifi_services/wifi_tcp_server.c as
#     PREREQUISITES and grep-guards each transport's own CreateSCPIContext()
#     call site against drift -- it does NOT compile or link either file
#     into the binary; only $(LIBSCPI_SRCS) is actually linked (see the next
#     bullet). But until this entry, NEITHER transport file was matched by
#     any path here. A PR touching only one transport (the exact shape of
#     change this test exists to catch) queued no job at all.
#     Found and filed as #1118 by #1115's round-3 adversarial audit, which
#     confirmed the mechanism against the workflow file and the Makefile
#     dependency and dispositioned it defer_ticket: it predates that PR
#     (run_999_tests has depended on both files since #999 shipped) and
#     #1115's own diff is unaffected (it touches firmware/src/libraries/scpi/**,
#     which already queues via the entry #1115 itself adds -- see the next
#     bullet).
#     The same audit's own new target ($(SCPI1003_BIN), for #1003/#1010)
#     depends on the same two transport files the same way, so this entry
#     covers it too, whichever of #1115/#1096 lands.
#   - test_1121_start_streaming_arm_cascade.c (#1121): the sibling of
#     test_953's cascade, in SCPIInterface.c rather than SCPIStorageSD.c. Its
#     Makefile target grep-guards that file for the five arms' order, the
#     in-loop torn-down latch and the post-loop reconciliation read, and fails
#     the BUILD (not just the test) if any has been reordered, reworded or
#     moved. SCPIInterface.c is ALREADY covered by the
#     'firmware/src/services/SCPI/**' entry above -- same situation as
#     test_947_sysinfo_write_abort.c -- so this bullet adds no new path, only
#     the record of which source the target reads and why. It compiles and
#     links nothing from firmware/: the cascade, the poll loop and the
#     reconciliation are re-implemented on the host, for the reason
#     test_999's bullet below establishes about this file.
#   - Checked while in here, per #1118's own "worth checking" note: a full
#     accounting of every $(*_BIN) target's Makefile prerequisites against
#     this list turned up one more gap of the identical shape.
#     $(SCPI999_BIN) also links LIBSCPI_SRCS/LIBSCPI_HDRS
#     (firmware/src/libraries/scpi/libscpi/{src,inc/scpi}/*) -- not matched by
#     any entry here either, so a libscpi-only change (parser.c, error.c, ...)
#     also queued no job. Closed with the same 'firmware/src/libraries/scpi/**'
#     entry #1115 independently adds for its own new #1003/#1010 target; per
#     this file's own precedent (see the #1001/PR-#1017 note above), a
#     duplicate entry from whichever of this PR / #1115 merges second is
#     harmless and expected -- keep one copy.
#     No other target's prerequisites were unmatched: every $(*_BIN) rule's
#     firmware-side dependencies resolve to a path already listed above.
#   - test_924_sd_manifest.c (#924): compiles firmware/src/Util/SdManifest.h
#     and LINKS firmware/src/Util/CRC32.c, so both get a line, as do
#     CRC32.h (the streaming API the accumulation model is asserted against)
#     and firmware/src/services/sd_card_services/sd_card_manager.c.
#
#     THAT LAST ONE IS THE SAME KIND OF ENTRY AS THE UsbCdc/wifi_tcp_server
#     PAIR ABOVE: sd_card_manager.c is not compiled or linked into the binary
#     -- it is a grep-guarded PREREQUISITE. The target fails the BUILD if that
#     file stops folding the running CRC in SDCardWrite() (its single write
#     funnel), or stops rendering lines through SdManifest_FormatLine /
#     SdManifest_RelativeName. Without the entry, the change most likely to
#     invalidate this suite -- an edit to the manager itself -- would queue no
#     job at all, which is exactly the gap #941's audit found for
#     AD7609Scale.h and #1118's for the two transports.
#
#     Listed by FILE, not as firmware/src/services/sd_card_services/**: that
#     directory holds sd_card_manager.h and nothing else this suite reads, and
#     the "a refactor escapes a file-scoped trigger" worry does not bite here
#     because the guards fail the build, loudly and by name, the moment the
#     identifiers stop appearing where they look for them.
#
#     Util/ is listed per-file for the same reason CircularBuffer, Logger and
#     FixedPointFmt are: the directory holds many files no host test reads.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/host/**'
      - 'firmware/src/Util/CircularBuffer.c'
      - 'firmware/src/Util/CircularBuffer.h'
      - 'firmware/src/Util/FixedPointFmt.h'
      # #1000: the generated log-budget fixture reads the ceiling out of both
      # of these -- the constant from the .h, the two reservations that make
      # it effective from the .c.
      - 'firmware/src/Util/Logger.h'
      - 'firmware/src/Util/Logger.c'
      - 'firmware/src/services/SCPI/**'
      - 'firmware/src/HAL/ADC/**'
      - 'firmware/src/HAL/DAC7718/**'
      - 'firmware/src/services/JSON_StringEscape.h'
      - 'firmware/src/services/JSON_Encoder.c'
      - 'firmware/src/config/default/FreeRTOSConfig.h'
      # #1056: the shared wait loop test_1056_wait_loop.c compiles, plus its
      # three consumers. WaitLoop.h sits directly in HAL/, which the HAL/ADC/**
      # and HAL/DAC7718/** globs above do not match.
      - 'firmware/src/HAL/WaitLoop.h'
      - 'firmware/src/HAL/UserSpi/UserSpi.c'
      - 'firmware/src/HAL/UserUart/UserUart.c'
      - 'firmware/src/HAL/UserI2c/UserI2c.c'
      # #1004: the ms<->tick assumptions test_1004_help_write_abort.c derives
      # are grepped straight out of this file (configTICK_RATE_HZ,
      # configTICK_TYPE_WIDTH_IN_BITS).
      - 'firmware/src/config/default/FreeRTOSConfig.h'
      # #1118: run_999_tests ($(SCPI999_BIN)) depends on both transports'
      # own CreateSCPIContext() call sites (grep-guarded prerequisites, not
      # compiled/linked in); neither was matched above, so a change confined
      # to one transport queued no job.
      - 'firmware/src/services/UsbCdc/UsbCdc.c'
      - 'firmware/src/services/wifi_services/wifi_tcp_server.c'
      # #1118: same target ($(SCPI999_BIN)) also links the vendored libscpi
      # sources (LIBSCPI_SRCS/LIBSCPI_HDRS) that #1115 adds a second consumer
      # of ($(SCPI1003_BIN)) -- #1115 adds this same entry for its own reason;
      # keep one copy, whichever PR merges second (see the #1001/#1017 note
      # above for the precedent).
      - 'firmware/src/libraries/scpi/**'
      # #924: run_924_tests compiles SdManifest.h, links CRC32.c, and
      # grep-guards sd_card_manager.c (not compiled/linked -- see the bullet
      # above). Without the last entry an edit to the manager alone queued no
      # job, and the manager is where this suite's premise actually lives.
      - 'firmware/src/Util/SdManifest.h'
      - 'firmware/src/Util/CRC32.c'
      - 'firmware/src/Util/CRC32.h'
      - 'firmware/src/services/sd_card_services/sd_card_manager.c'
      - '.github/workflows/host-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tests/host/**'
      - 'firmware/src/Util/CircularBuffer.c'
      - 'firmware/src/Util/CircularBuffer.h'
      - 'firmware/src/Util/FixedPointFmt.h'
      # #1000: the generated log-budget fixture reads the ceiling out of both
      # of these -- the constant from the .h, the two reservations that make
      # it effective from the .c.
      - 'firmware/src/Util/Logger.h'
      - 'firmware/src/Util/Logger.c'
      - 'firmware/src/services/SCPI/**'
      - 'firmware/src/HAL/ADC/**'
      - 'firmware/src/HAL/DAC7718/**'
      - 'firmware/src/services/JSON_StringEscape.h'
      - 'firmware/src/services/JSON_Encoder.c'
      - 'firmware/src/config/default/FreeRTOSConfig.h'
      # #1056: the shared wait loop test_1056_wait_loop.c compiles, plus its
      # three consumers. WaitLoop.h sits directly in HAL/, which the HAL/ADC/**
      # and HAL/DAC7718/** globs above do not match.
      - 'firmware/src/HAL/WaitLoop.h'
      - 'firmware/src/HAL/UserSpi/UserSpi.c'
      - 'firmware/src/HAL/UserUart/UserUart.c'
      - 'firmware/src/HAL/UserI2c/UserI2c.c'
      # #1004: the ms<->tick assumptions test_1004_help_write_abort.c derives
      # are grepped straight out of this file (configTICK_RATE_HZ,
      # configTICK_TYPE_WIDTH_IN_BITS).
      - 'firmware/src/config/default/FreeRTOSConfig.h'
      # #1118: see the matching entries under pull_request above.
      - 'firmware/src/services/UsbCdc/UsbCdc.c'
      - 'firmware/src/services/wifi_services/wifi_tcp_server.c'
      - 'firmware/src/libraries/scpi/**'
      # #924: see the matching entries under pull_request above.
      - 'firmware/src/Util/SdManifest.h'
      - 'firmware/src/Util/CRC32.c'
      - 'firmware/src/Util/CRC32.h'
      - 'firmware/src/services/sd_card_services/sd_card_manager.c'
      - '.github/workflows/host-tests.yml'

permissions:
  contents: read   # checkout + gcc build + run only, no writes

jobs:
  host-tests:
    name: tests/host (gcc, no hardware)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make run
        working-directory: tests/host
        run: make run
